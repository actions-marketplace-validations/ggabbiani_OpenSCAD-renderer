name: Draft Release

on:
  push:
    tags: [ "v*.*.*" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  draft-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true